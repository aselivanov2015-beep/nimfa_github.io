<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нимфа — Салон красоты</title>
    <style>
        /* CSS Variables */
        :root {
            --bg-base: #e8c3c9;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --text-light: #ffffff;
            
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            
            --card-black-bg: #1a1a1a;
            --card-white-bg: #ffffff;
            
            --font-heading: 'Playfair Display', 'Times New Roman', serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            --radius-lg: 32px;
            --radius-md: 24px;
            --radius-pill: 50px;
            
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 60%, rgba(255,255,255,0.2) 0%, transparent 50%),
                linear-gradient(180deg, #f4d3d8 0%, #e8bcc4 40%, #d69ba6 100%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 0;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; transition: var(--transition); }
        ul { list-style: none; }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3, h4 { font-weight: 400; line-height: 1.2; letter-spacing: -0.5px; }

        /* --- АНИМАЦИИ --- */
        
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }

        .hover-scale {
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s ease;
            will-change: transform;
        }

        .hover-scale:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        /* --- СТИЛИ --- */

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 16px 32px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-pill);
            background-color: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            user-select: none;
            width: 100%;
        }

        .btn:active { transform: scale(0.96); }
        .btn-dark { background-color: var(--text-main); color: var(--text-light); }
        .btn-dark:hover { background-color: #333333; }
        
        .btn-glass {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: var(--text-main);
        }
        .btn-glass:hover { background: rgba(255, 255, 255, 0.5); }

        /* HERO GRID */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 60px;
            align-items: stretch;
        }

        .hero-left-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card-glass-slogan {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            min-height: 280px;
        }

        .card-glass-slogan h1 {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.1;
            text-shadow: 0 2px 10px rgba(255,255,255,0.3);
        }

        .card-glass-slogan .address {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 500;
            opacity: 0.8;
        }

        .card-black-cta {
            background-color: var(--card-black-bg);
            border-radius: var(--radius-lg);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--glass-shadow);
            min-height: 220px;
        }

        .card-black-cta h2 {
            color: var(--text-light);
            font-size: 2rem;
            margin-bottom: 24px;
        }

        .card-black-cta .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-black-cta .btn {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
        }
        .card-black-cta .btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .card-black-cta .btn-primary-white {
            background-color: #ffffff;
            color: var(--text-main);
            border: none;
        }
        .card-black-cta .btn-primary-white:hover { background-color: #f0f0f0; }

        .card-white-logo {
            background-color: var(--card-white-bg);
            border-radius: var(--radius-lg);
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }

        .card-white-logo::before {
            content: '';
            position: absolute;
            top: 50%;
            right: -20%;
            transform: translateY(-50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ffb6c1 0%, #ff8a9f 100%);
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(20px);
            z-index: 0;
        }

        .card-white-logo > * {
            position: relative;
            z-index: 1;
        }

        .date-block { display: flex; flex-direction: column; }
        .date-month { font-family: var(--font-heading); font-size: 3rem; font-weight: 600; line-height: 1; color: var(--text-main); }
        .date-year { font-family: var(--font-body); font-size: 1.5rem; font-weight: 300; color: #999; line-height: 1.2; letter-spacing: 2px; }

        .logo-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px 0;
            z-index: 2;
        }

        .logo-image-container img {
            max-width: 90%;
            max-height: 250px;
            height: auto;
            object-fit: contain;
            /* Делает белый фон логотипа прозрачным, сливая его с карточкой */
            mix-blend-mode: multiply; 
        }

        .card-white-logo .minimal-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: right;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ОСТАЛЬНЫЕ БЛОКИ */
        .section-padding { padding: 60px 0; }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .service-card {
            padding: 32px;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-md);
        }

        .service-card h3 { font-size: 1.4rem; margin-bottom: 20px; font-weight: 500; }

        .service-list { margin-bottom: 24px; flex-grow: 1; }

        .service-list li {
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.95rem;
        }

        .service-list li::before {
            content: '';
            display: block;
            width: 5px;
            height: 5px;
            background-color: var(--text-main);
            border-radius: 50%;
            margin-top: 8px;
            flex-shrink: 0;
            opacity: 0.4;
        }

        .service-price { font-size: 0.95rem; color: var(--text-main); font-weight: 600; margin-bottom: 20px; display: block; }

        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .rating-badge .stars { color: #ff6b81; }

        .review-card {
            padding: 32px;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-md);
        }

        .review-text { color: var(--text-main); font-size: 0.95rem; margin-bottom: 20px; flex-grow: 1; }
        .review-author { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); }

        footer { padding: 40px 0; }

        .footer-inner {
            padding: 40px;
            border-radius: var(--radius-lg);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 32px;
        }

        .footer-col h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .footer-col p, .footer-col a { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; display: block; }
        .footer-col a:hover { color: var(--text-main); }

        /* Responsive */
        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; }
            .card-white-logo::before { width: 250px; height: 250px; right: -10%; }
        }

        @media (max-width: 768px) {
            body { padding: 20px 0; }
            .card-glass-slogan h1 { font-size: 2.2rem; }
            .card-white-logo { padding: 32px; min-height: 350px; }
            .date-month { font-size: 2.5rem; }
            .card-black-cta { padding: 32px; }
            .section-padding { padding: 40px 0; }
            .footer-inner { padding: 32px; }
            
            .hover-scale:hover { transform: none; box-shadow: var(--glass-shadow); }
        }
    </style>
