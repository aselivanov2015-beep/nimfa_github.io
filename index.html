<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX — Веб-разработка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Используем строгий гротеск для меню и жирный для логотипа -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --font-body: 'Inter', sans-serif;
            --font-logo: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden; /* Фиксируем экран, как на референсе */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Главный контейнер-окно с матовым стеклом */
        .hero-window {
            position: relative;
            width: 95vw;
            height: 90vh;
            border-radius: 24px;
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* Фоновая радужная фигура (размытая) */
        .bg-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 800px;
            opacity: 0.6;
            filter: blur(40px);
            z-index: 0;
            animation: pulse 15s infinite alternate;
        }

        /* Четкая радужная фигура по центру (поверх текста) */
        .main-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            max-width: 450px;
            z-index: 2;
            pointer-events: none; /* Чтобы не мешала кликам */
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }

        /* Навигация */
        nav {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #d0a8ff; /* Светло-фиолетовый при наведении */
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-signup {
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            background: transparent;
        }
        .btn-signup:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-signin {
            background: #d0a8ff;
            color: #000;
            border: 1px solid #d0a8ff;
        }
        .btn-signin:hover {
            background: #e0c4ff;
            transform: translateY(-2px);
        }

        /* Центральный контент */
        .center-content {
            position: relative;
            z-index: 1; /* Текст под фигурой, но над фоном */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Огромное название компании */
        .logo-text {
            font-family: var(--font-logo);
            font-size: 14vw; /* Адаптивный размер */
            font-weight: 900;
            letter-spacing: 0.05em;
            line-height: 1;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            margin: 0;
            /* Эффект свечения */
            text-shadow: 0 0 40px rgba(208, 168, 255, 0.3);
            user-select: none;
        }

        /* Боковые элементы */
        .left-sidebar {
            position: absolute;
            left: 50px;
            bottom: 50px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 250px;
        }

        .year {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            position: absolute;
            left: -40px;
            top: 0;
        }

        .about-text h4 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .about-text h4::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
        }

        .about-text p {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .right-sidebar {
            position: absolute;
            right: 50px;
            bottom: 50px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
        }

        .socials {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .socials a {
            color: var(--text-main);
            font-size: 1.2rem;
            text-decoration: none;
            transition: transform 0.3s;
        }
        .socials a:hover {
            transform: scale(1.2);
            color: #d0a8ff;
        }

        .btn-tutorial {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-tutorial:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Анимации */
        @keyframes float {
            0% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -55%); }
            100% { transform: translate(-50%, -50%); }
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.1) rotate(15deg); }
        }

        /* Адаптивность */
        @media (max-width: 1024px) {
            .logo-text { font-size: 18vw; }
            .main-shape { width: 60%; }
            .nav-links { display: none; } /* Скрываем меню на планшетах */
            .left-sidebar, .right-sidebar { position: relative; left: auto; right: auto; bottom: auto; margin: 20px; align-items: center; text-align: center; }
            .hero-window { display: flex; flex-direction: column; justify-content: space-between; }
            .year { display: none; }
            .about-text h4 { justify-content: center; }
            .socials { flex-direction: row; }
            .center-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
            .left-sidebar { margin-top: auto; z-index: 10; }
            .right-sidebar { margin-bottom: 30px; z-index: 10; flex-direction: column; }
        }

        @media (max-width: 768px) {
            .nav { padding: 20px; }
            .logo-text { font-size: 22vw; }
            .main-shape { width: 80%; }
            .auth-buttons { display: none; } /* Скрываем кнопки на телефонах */
        }
    </style>
